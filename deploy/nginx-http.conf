# Initial HTTP vhost. Install only after inspecting existing reverse proxy on the VPS.
server {
    listen 80;
    server_name maker3d.emersol.ai;
    client_max_body_size 36m;
    location / {
        proxy_pass http://127.0.0.1:3183;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
# After the A record resolves, obtain TLS using the existing certificate manager.
# With Certbot: certbot --nginx -d maker3d.emersol.ai --redirect
# Public operation requires HTTPS because cookies are Secure.
