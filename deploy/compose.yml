name: maker3d
services:
  app:
    image: maker3d:${MAKER3D_VERSION:-local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - /etc/maker3d/runtime.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_MODE: postgres
      FILE_STORAGE: supabase
      PUBLIC_ORIGIN: https://maker3d.emersol.ai
      COOKIE_SECURE: '1'
      TRUST_PROXY: '1'
    ports:
      - '127.0.0.1:3183:3000'
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: '1.0'
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
